excerpt:
  lang: it
  text: "Un progetto di riqualificazione urbanistico complessivo, che tiene conto delle frammentarietà esistente e delle problematiche viabilistiche. L’idea da risposta all’attuale ambiguità tra percorsi pedonali e viabilistici attraverso una soluzione valida per l’intero centro. Le soluzioni diventono puntuali nei punti topici: La parte antistante al Municipio; il nuovo sagrato della Chiesa ; una nuova Piazza; un nuovo percorso pedonale lungo il Fiume ; una nuova soluzione nella parte antistante al Parco."
