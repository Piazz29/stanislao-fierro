excerpt:
  lang: de
  text: "Museumsgarten und neuer Haupteingang: Der Abbruch der bestehenden Stromkabine und der anliegenden Nebenbauten erlauben eine großzügige Öffnung des Hofes und der Westseite des Museums zur Stadt hin und die Schaffung eines besucherfreundlichen neuen Haupteinganges an der stark frequentierten Museumsstraße. Unser Projektvorschlag sieht ein neues Eingangsgebäude in paralleler Richtung zum benachbarten INA“-Gebäude (Sitz der Städtischen Bibliothek) vor, mit einer Anbindung an die Fassade des als Tor zur Altstadt konzipierten Gebäudes aus den 30er Jahren."
