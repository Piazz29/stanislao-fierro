excerpt:
  lang: it
  text: L’ ASILO Si è scelto un progetto educativo che preveda lo spazio–mensa e lo svolgimento delle attività a tavolino e speciali in un unico ambiente, la sezione. Ogni sezione è divisa in una zona per le attività pratiche, ove sono previsti i lavabi, i servizi igienici, un fasciatoio, un pilozzo, e armadietti personali da usare come deposito, e una zona a doppia altezza per lo svolgimento delle attività comuni. Questo spazio presenta una sezione che si apre a cono verso il giardino; questa particolare forma ha permesso uno studio attento dell’ illuminazione.
