text:
  it:
    - "Un intervento di superficie sull’intero paese: una piazza ritrovata, un giardino incorporato nel disegno urbano, una distinzione chiara tra strada e percorsi pedonali."
    - "Sono stati ridisegnati gli accessi degli edifici principali: scale, gradini, piattaforme."
  de:
    - "Ein Eingriff an der Oberfläche des ganzen Dorfes: ein wiedergewonnener Platz, ein Garten als Teil der Ortsgestaltung, eine klare Trennung von Straße und Fußwegen."
    - "Neu gestaltet wurden die Zugänge der wichtigsten Gebäude: Treppen, Stufen, Podeste."
  en:
    - "A surface intervention across the whole village: a recovered square, a garden drawn into the street plan, a clear distinction between road and footpaths."
    - "The entrances of the main buildings were redesigned: stairs, steps, landings."
excerpt:
  lang: de
  text: Der bestehende Grünbereich ist gekennzeichnet durch die alten Apfelbäume, welche eine sehr angenehme und sinnliche Stimmung vermitteln. Dieser Bereich bildet einen Kontrast zum dicht verbauten Ortskern und befindet sich inmitten des Dorfkerns von Lüsen. Zwei Wege durchschneiden diagonal den Grünbereich und bilden eine direkte Verbindung von beiden Richtungen her zum Ortskern. Dieses Konzept soll das Vorbild der neuen Grünraumgestaltung des neu zu gestaltenden Areals bilden, das von seiner Lage einen sehr sensiblen Umgang mit Gelände und Gebäuden verlangt.
  source: https://www.stanislaofierro.com/index.php?p=42&lang=it
