text:
  it:
    - "Il ridisegno dello spazio davanti alla Libera Università di Bolzano: una pavimentazione in pietra, alberi da fiore, sedute circolari in acciaio e legno intorno ai tronchi."
  de:
    - "Die Neugestaltung des Platzes vor der Freien Universität Bozen: ein Steinbelag, blühende Bäume, runde Sitzbänke aus Stahl und Holz um die Stämme."
  en:
    - "The redesign of the square in front of the Free University of Bozen-Bolzano: stone paving, flowering trees, round steel and timber benches around the trunks."
