excerpt:
  lang: it
  text: "Il progetto riguarda una complessa riqualificazione urbana dell'antico Alcazar della città di Baza. Si progettano, inoltre, tutti i sistemi di collegamento meccanici verticali tra l'Alcazar e il centro storico, e tutti gli spazi aperti (piazze, strade, rampe, slarghi) di connessione. Inoltre, sul limite dell'area, si inserisce un edificio pubblico a destinazione socio-sanitaria del quale la caratteristica fondamentale è di essere un autentico collegamento pubblico tra la parte alta e bassa della città. Si progettano anche le attrezzature pubbliche come: bar, ristoranti, bagni, arredo urbano e illuminazione pubblica."
