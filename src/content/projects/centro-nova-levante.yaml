excerpt:
  lang: de
  text: Das neue Projekt erstreckt sich über die ganze Romstrasse mit dem Schwerpunkt der Sanierung des Kirchplatzes. Der neue Eingriff fängt ungefähr beim Caffè Panorama an, und erstreckt sich über das gesamte Gebiet bis zur neuen Grundschule in der Nähe des Bodner Baches. Die Romstrasse gleicht in seiner momentanen Situation einer Achse , wo sich links und rechts kleine Plätze, Strassenerweiterungen und mehrere Parkmöglichkeiten befinden, die keinen bestimmten Prinzip oder Anordnung folgen.
