text:
  it:
    - Piazza realizzata a Bolzano. Nel 2000 ha ricevuto il Premio Architettura Città di Oderzo e una menzione speciale al Premio Europeo di Architettura «Luigi Cosenza».
  de:
    - Ein realisierter Platz in Bozen. 2000 erhielt er den Architekturpreis Città di Oderzo und eine besondere Erwähnung beim Europäischen Architekturpreis „Luigi Cosenza“.
  en:
    - A completed square in Bolzano. In 2000 it received the Città di Oderzo Architecture Prize and a special mention at the European Architecture Prize “Luigi Cosenza”.
