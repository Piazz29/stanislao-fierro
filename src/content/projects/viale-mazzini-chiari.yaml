excerpt:
  lang: it
  text: "storico. Il Viale si caratterizza per avere un’alberatura non simmetrica: il lato Sud con un doppio filare ed il lato Nord quasi totalmente sprovvisto d’alberi pubblici. Il Nord, trova nel tema del muro una chiara espressività architettonica. Il verde privato, in ogni modo, porta i propri benefici sul Viale. E’ vero che il Viale non è utilizzato come Viale urbano, ma è pur vero che in rapporto alla sua lunghezza le intersezioni trasversali non sono numerosissime, semplificando lo stesso intervento di riqualificazione."
