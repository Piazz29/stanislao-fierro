excerpt:
  lang: it
  text: "Il progetto riguarda la riconversione di una struttura industriale (una Fornace con forno Hoffmann per la produzione a ciclo continuo di laterizi, costruita nel 1908, e dismessa nel 1970) in un centro scolastico e culturale. Per la precisione le nuove necessità saranno: - Scuola media 6 cicli, 18 classi , 450 alunni., Palestra di tipo normale, Teatro per 700 posti;- Uffici ( restauro edificio esistente);- parchiggi (6000 mq); siatemazioni esterne ( Piazze, piste ciclo-pedonali). L’idea progettuale e tesa a formare un intervento unitario e riconoscibile."
  source: https://www.stanislaofierro.com/index.php?p=22&lang=it
