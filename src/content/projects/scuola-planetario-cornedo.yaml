  text: Il nuovo edificio si “addiziona” alla scuola esistente, generando un nuovo ordine urbano. Il nuovo progetto si relazione con forza ad un basamento esistente, ove si sviluppa il planetario. Al di sopra del basamento un primo piano , leggero, sopra il quale si organizzano due piani molto compatti. Qui le aperture, oltre a garantire un’adeguata illuminazione, sono disposte in modo tale da relazionarsi con lo straordinario paesaggio circostante
