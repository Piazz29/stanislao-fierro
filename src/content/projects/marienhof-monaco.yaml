  text: "Beim neuen Entwurf des Marienhofes spielt die städtebauliche Historie eine tragende Rolle. Fogende Punkte bilden die Grundlage des Entwurfes: 1)die Geometrie des gesamten Platzes basiert auf den geschichtlichen Spuren des Ortes. Der Verlauf der mittelalterlichen Stadtmauer wird auf dem neuem Platz durch zwei breite Streifen aus weissem Naturkalkstein mit einer Entwässeungsrinne, die den gesamten Platz durchlaufen, wieder aufgenommen."
