excerpt:
  lang: it
  text: Il progetto di riqualificazione del centro storico di Castelfranco Emilia si base sulla convinzione di poter conferire un carattere unitario ad un area vasta, articolata, e attualmente frammentata.L’attenta lettura dei caratteri, diviene premessa essenziale, al progetto, che desidera non imporsi alle preesistenze, ma in un certo qual modo riprenderlo e ricucirlo. La “ misura” , intesa come gesto ponderato, misurato e relazionato, diviene lo strumento guida per tutto l’intervento.
