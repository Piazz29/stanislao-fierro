excerpt:
  lang: es
  text: En Puerto Real, al igual que ocurre en otras ciudades, la posición del ferrocarril ha impedido un crecimiento natural de la trama urbana, en este caso hacia el Norte del Casco Histórico. Esta desvinculación entre dos partes de ciudad, hoy resuelta por medio de un paso elevado en continuidad con la Av. de la Constitución, se siente aún más acusada por otro límite paralelo al ferrocarril como es la actual carretera de circunvalación.
