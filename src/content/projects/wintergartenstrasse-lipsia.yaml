excerpt:
  lang: de
  text: Das neue Gebäude bildet gemeinsam mit dem Wintergartenhochhaus und dem Gebäudekopf des Victor`s Residenz Hotel eine Gebäudekomposition mit einer interessanten Wechselwirkung. Das Wintergartenhochhaus, das hoch und schlank ist bzw. eine Vertikale bezeichnet; im Kontrast dazu steht das neue horizontale und flache Gebäude. Gemeinsam mit der bestehenden Blockrandbebauung der Wintergartenstrasse und dem Gebäudekopf des Victor`s Residenz Hotels wird ein neuer städtischer Platz geschaffen. Der neue Platz schließt die Achse des Willy-Brandt-Platzes nach Osten hin ab.
  source: https://www.stanislaofierro.com/index.php?p=23&lang=it
