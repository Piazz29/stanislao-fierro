excerpt:
  lang: it
  text: L’IDEA L’idea del progetto desidera mettere in atto , dopo attente considerazioni insediative, il tema del “Basamento”. Nell’analisi dei caratteri dell’area, tra le altre cose , colpisce il Basamento del Cimitero, e della Scuola Elementare, che crediamo, non casualmente della stessa altezza. Il nuovo intervento intende allinearsi all’altezza dei basamenti esistenti, ed in un certo modo, dialogare con essi. Si innescano, in questo modo, attraverso la composizione dei nuovi volumi, nuove ed interessanti relazioni.
