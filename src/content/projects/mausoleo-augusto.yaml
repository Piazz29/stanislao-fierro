text:
  it:
    - Concorso internazionale, finalista nel 2006, con José Ignacio Linazasoro. Il progetto unisce i due livelli della piazza e il Mausoleo in un solo spazio urbano, compatibile con gli scavi archeologici previsti.
  de:
    - Internationaler Wettbewerb, Finalist 2006, gemeinsam mit José Ignacio Linazasoro. Das Projekt verbindet die beiden Ebenen des Platzes und das Mausoleum zu einem einzigen Stadtraum, vereinbar mit den geplanten archäologischen Grabungen.
  en:
    - International competition, finalist in 2006, with José Ignacio Linazasoro. The design joins the two levels of the square and the Mausoleum into a single urban space, compatible with the planned archaeological excavations.
excerpt:
  lang: it
  text: Le seguenze e le prospettive che caratterizzano gli spazi di Roma sono sempre con sapienza interrotte da elementi monumentali (fontane, obelisci, colonne ecc.), formando richiami ottici, che hanno lo scopo di tenere uniti spazi a volte molto distanti tra loro. Questa strategia consolidata, è giunta fino ai nostri giorni con forza e chiarezza. Questo principio urbanistico che inizia all’epoca di Sisto V con il suo Architetto Carlo Fontana, lo troviamo con evidenza anche in Campo Marzio. La Piazza di Augusto Imperatore, invece, sembra uno spazio isolato ai margini, e non influenzato da questa strategia urbanistica.
  source: https://www.stanislaofierro.com/index.php?p=64&lang=it
