excerpt:
  lang: it
  text: Il nuovo progetto è finalizzato , in prima istanza ad una ricucitura urbana, che prende le mosse proprio dai caratteri consolidati ma anche dagli aspetti più frammentati . Importante , ai fini dell’idea, è stato considerare la Piazza della Repubblica , come spazio concluso, naturale punto di unione tra Via Gonzaga e Via Cesarea. La nuova Piazza , attraverso una nuova pavimentazione incorporerà anche Via Passerini. Questo semplice prolungamento oltre ad ottenere una figura trapezia decisamente più regolare , dona un attacco a terra più adeguato sia agli edifici esistenti che a quelli di nuova costruzione.
