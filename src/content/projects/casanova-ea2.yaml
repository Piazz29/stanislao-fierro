text:
  it:
    - Quattro edifici intorno a una corte nel quartiere CasaNova. Verso nord le facciate hanno finestre, verso sud logge. Quasi tutti gli alloggi hanno accesso diretto al giardino.
  de:
    - Vier Gebäude um einen Hof im Stadtviertel CasaNova. Nach Norden haben die Fassaden Fenster, nach Süden Loggien. Fast alle Wohnungen haben direkten Zugang zum Garten.
  en:
    - Four buildings around a courtyard in the CasaNova district. The north façades have windows, the south façades loggias. Almost every flat has direct access to the garden.
excerpt:
  lang: de
  text: Aufgrund der problematischen Bautiefe der Baukörper, wurden diese, ohne Kubatureinbussen, in ihrer Tiefe reduziert. Die schlankeren Baukörper und die perspektivische Aufweitung schaffen einen geräumigen, gut durchlichteten Hofraum. Laut Durchführungsplan sollen Blockaussenseite und Hofseite differenziert werden, dieses führte jedoch bei der Entwurfsfase zu einem Konflikt mit dem funktionellen Anspruch einer Nord-Südorientierung der Wohnungen.
