excerpt:
  lang: it
  text: Un progetto di riqualificazione urbana finalizzato al conferimento di un carattere unitario all’intero paese. La nuova Piazza unisce due parti di paese prima scollegate, oltre a liberare il prospetto del vecchio Gasthof Krone, che ora prospetterà direttamente sulla stessa Piazza. Il nuovo invaso permette la visione, prima preclusa, del muro di cinta del cimitero e e della sovrastante Chiesa. Si è previsto uno studio generale dei materiali per le pavimentazioni e per l’illuminazione pubblica. Questi interventi contribuiranno a rendere ancora più unitario l’intervento.
