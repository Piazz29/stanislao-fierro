excerpt:
  lang: it
  text: L’idea di progetto intende generare un forte legame con l’esistente. Decisione importante è stata quella di posizionare la nuova scuola Materna ad un piano inferiore rispetto al piano di calpestio attuale. Questo nuovo posizionamento ha innescato interessanti relazioni pedonali ed ha permesso di ridurre notevolmente l’edificio fuori terra. La relazione della nuova volumetria nell’assetto urbanistico esistente desidera essere sobrio ma al contempo riconoscibile. Il nuovo edificio permette di ricavare maggiori spazi aperti verso il cortile e l’attuale frutteto parrocchiale .
