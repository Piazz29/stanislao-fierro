text:
  it:
    - Il progetto ricuce gli spazi residui intorno al Municipio e al Centro culturale e riapre il centro verso l’argine del Livenza.
    - La parte centrale della piazza diventa pedonale. Il monumento ai caduti resta al suo posto.
  de:
    - Das Projekt verbindet die Restflächen um Rathaus und Kulturzentrum und öffnet das Zentrum wieder zum Damm der Livenza.
    - Der mittlere Teil des Platzes wird Fußgängerzone. Das Kriegerdenkmal bleibt an seinem Ort.
  en:
    - The project knits together the leftover spaces around the town hall and the cultural centre, and reopens the centre towards the Livenza embankment.
    - The middle of the square becomes pedestrian. The war memorial stays where it stands.
excerpt:
  lang: it
  text: "La ricerca di unitarietà, attraverso il ridisegno degli spazi residui esistenti, è il punto di partenza per la nuova Piazza di Torre di Mosto. Il superamento dell'attuale collisione di frammenti di costruito, avviene attraverso la ricerca di un nuovo collante tra resti di spazi aperti e risignificazione dei retri degli edifici realizzati in epoche diverse. Il nuovo spazio pubblico rimetterà in una scena comune, elementi esistenti che rappresentano l'essenza della vita civica della città: il Municipio, il Centro Cultutrale e lo spazio aperto verso il fiume Livenza."
  source: https://www.stanislaofierro.com/index.php?p=59&lang=it
