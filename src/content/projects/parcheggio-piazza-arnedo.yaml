excerpt:
  lang: es
  text: "El proyecto del nuevo aparcamiento subterráneo da ocasión para conferir orden y unidad a la parcela entera. Este nuevo proyecto se presenta como un basamento delimitado por las calles existentes y el pórtico de la calle Huerta. Dicho basamento resuelve las varias necesidades: el garaje subterráneo y la plaza, que se convierte en el elemento expresivo de todo el proyecto. La nueva plaza se extenderá en un solo nivel apropiándose también del pórtico que se asoma sobre la calle Huertas. En las calles León Gentico y Aragón el desnivel natural se resuelve con escalinatas de carácter urbano."
