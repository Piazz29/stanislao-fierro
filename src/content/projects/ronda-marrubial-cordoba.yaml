excerpt:
  lang: es
  text: El nuevo dibujo de los espacios abiertos, que gravitan alrededor a la Muralla, es puesto a conferir un caracter unitario a la intervienciòn. Es una respuesta projectual a una preexistentia tan compleja y rica, como framentada. El projecto intenta de sacar sus propria fuerza desde la lectura y el saque de los “fragmentos”. La Muralla hoy se presenta como una larga spina dorsal, a quien falta una “Cabeza“ y una “Cola”. Ademàs, los pocos puntos de atravesamiento no aprovechan la ocasiòn de far percibir el aspero pasaje entre el casco antiguo y la nueva urbanizaciòn a Northe.
