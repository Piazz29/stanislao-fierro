excerpt:
  lang: de
  text: Die Rathausbrücke und die Breitstrominsel in ihrer aktuellen Situation stellen ein urbanistisches Problem in einem historischen Kontext dar. Die historische Krämerbrücke wird komplett von der Rauthausbrücke und dem Baumbestand der Breitstrominsel verdeckt und tritt somit komplett in den Hintergrund. Lediglich von der Nordseite kann man dieses historische Bauwerk bewundern, jedoch nicht geniessen, da auch die Situation der Freiflächen sehr ungepflegt ist.
