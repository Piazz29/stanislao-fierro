  text: I lavori di recupero e rifunzionalizzazione della struttura si pongono come obiettivo principale un’accurata opera di restauro della struttura storica che ne evidenzi i tratti originali, il tutto inserito in una più complessiva sistemazione delle aree. L’approccio progettuale privilegia pertanto il restauro conservativo quale processo indispensabile per valorizzare e rendere leggibili gli elementi costitutivi del fabbricato.
