excerpt:
  lang: it
  text: Il progetto occupa tutto il lotto a disposizione e sviluppa per 9 piani in altezza. L’idea si fonda si di un edificio molto compatto, a cui si contrappone una regolare orizzontalità ed una modulazione apparentemente libera delle forature. La parte basamentale, piena monomaterica e leggermente rientrante , risolve l’attacco a terra oltre che dare soluzione agli accessi. La monotonia degli elementi orizzontali è interrotta in maniera puntuale con particolari punti di vista verso il paesaggio. Al piano terra si trovano la hall e gli elementi di distribuzione.
  source: https://www.stanislaofierro.com/index.php?p=15&lang=it
