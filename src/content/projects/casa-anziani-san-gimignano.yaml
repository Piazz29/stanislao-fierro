excerpt:
  lang: it
  text: Le scelte progettuali vengono basamentate da una attenta lettura dei caratteri dei luoghi, sintesi del dialogo, secolare e stratificato, tra il paesaggio ed il manufatto storico. La necessità di riqualificare il presidio socio-sanitario di Santa Fina, offre, unitamente alla modernizzazione delle attuali spazi, una starordinaria occasione di recupero edlizio , urbanistico e paesaggistico. Con la suddetta premessa, l’intervento avrà un atteggiamento conservativo, recuperando e riqualificando, rispettando l’attuale destinazione. L’intervento si muoverà ,tutelando le parti storiche, nella riconoscibilità dell’intervento contemporaneo.
