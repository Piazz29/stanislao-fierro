text:
  it:
    - Concorso nazionale vinto nel 2001. Sotto la piazza, un parcheggio su più livelli; in superficie, uno spazio aperto davanti al Palazzo di Giustizia.
    - La luce naturale scende nei piani interrati attraverso tagli e lucernari.
  de:
    - Nationaler Wettbewerb, 2001 gewonnen. Unter dem Platz liegt eine mehrgeschossige Tiefgarage, darüber ein offener Platz vor dem Gerichtsgebäude.
    - Tageslicht fällt durch Einschnitte und Oberlichter bis in die unteren Geschosse.
  en:
    - National competition, won in 2001. Beneath the square lies a car park on several levels; above it, an open space in front of the courthouse.
    - Daylight reaches the lower floors through cuts and rooflights.
