excerpt:
  lang: es
  text: Entendemos que las construcciones actuales de los cuartos de exportadores son un símbolo para la imagen de la ciudad, y de buena factura, por lo que se propone una rehabilitación integral de los mismos, que consistirá fundamentalmente en:_ Nueva distribución interior de las naves, reduciendo el número actual de cuartos en un 50%, por lo que contaríamos con un mínimo de 63 cuartos de exportadores. Cada uno de ellos contará con una superficie interior de 145m2, divididos en 100m2 en planta baja y 45m2 en una entreplanta central bajo los lucernarios.
