excerpt:
  lang: de
  text: "Es werden jegliche Festlegungen und Vorprüfungen für anfällige Nutzungen vermieden. Der neue Kulturplatz tritt in den Dienst der Gebäude und nimmt sich mit vornehmer Haltung zurück. Die Museumstrasse und Kulturplatz werden somit ein Freiräume mit Nutzungszonen: Entspannung und Besinnlichkeit auf dem Kulturplatz, und Dynamik und Aktivität auf der Museumstrasse. Das Theater und die Tonhalle werden mit einem Wasserspiel und Beleuchtung stärker inszeniert."
