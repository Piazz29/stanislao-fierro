excerpt:
  lang: it
  text: Un nuovo solido, che nasce dall’ esistente e si innalza a vista del parco, va a completare ed enfatizzare quella geometria pura di base che tanto caratterizza l’ edificio. Dal lato esposto a Nord nasce una corte che rimane a cielo aperto. Essa sfrutta le forme deteriorate dal tempo che diventano cornice al panorama. Allo stesso tempo fa da fulcro-nodo dell’ intero progetto; da essa parte infatti una promenade architettonica che accarezza l’ intero edificio per riportare lo sguardo a questo spazio comune d’ entrata.
