excerpt:
  lang: it
  text: Il nuovo edificio si presenta con una forma compatta ed unitaria, assecondando il senso longitudinale del lotto. L’ingresso principale avviene da Via Scuderie, attraverso un taglio a tutt’altezza che incide in profondità la semplicità del volume. Questo taglio, estremamente espressivo, accoglie tutti gli ingressi rappresentativi (front office, uffici ecc.) ed al contempo cattura la luce solare facendola percepire, con matematica precisione , fino al cuore distributivo dell’edificio. L’edificio nel suo sviluppo si caratterizza per la sua chiusura verso Nord-Est-Ovest, aprendosi invece verso Sud.
