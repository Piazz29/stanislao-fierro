  text: "Die Entwicklung des Kirchplatzes zu einem attraktiven, urbanen Ort der Stadt an der ablesbaren Schnittstelle zwischen Stadtzentrum und Seeanbindung orientiert sich an folgenden Leitsätzen: - Neugestaltung des Platzes und der städtischer Raumbezüge unter Referenzierung historischer Schichten des Ortes. - Wiederaufbau einer fehlenden Stadtmitte durch eine harmonische einheitliche Verbindung der fragmentierten einzelnen Stadtelemente - Zusammenführung des Platzraumes zu einer (be-)nutzbaren, aufenthaltsfreundlichen Platzoberfläche, unter Integration der verkehrlichen Raum- und Nutzungsansprüche."
