  text: "La finalidad del proyecto es de construir un nuevo espacio con un caràcter unitario y reconocible, que tiene una clara fruiciòn urbana, y que potencia, simultaneamente, la fragmentaciòn de las preexistencias. La nueva articulaciòn tiene que aclarar la relaciòn entre recorridos peatonales y de viabilidad, entre espacios vierdes y pavimentados, regenerando la relaciòn con los edificios circunstantes. Los nuevos espacios tienen que esser complejos y flexibles, ser capaz de ser usado por varios finalidades. El nuevo proyecto quere poner en acto con fuerza algunos temas: el Zòcalo; el Erosiòn; la Luz."
